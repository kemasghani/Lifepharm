# Lighthouse on a GitHub runner: a datacentre Linux machine with two CPU cores and no GPU, close to the machines
# PageSpeed Insights uses. Started by hand (Actions > Lighthouse lab > Run workflow). It measures one address several
# times and keeps the full trace of any run whose first paint is late (docs/tech-debt.md, TD-039). No secrets, read-only.
name: Lighthouse lab

on:
  workflow_dispatch:
    inputs:
      url:
        description: Public page to measure
        default: https://staging.lifepharm.com/
      runs:
        description: Number of runs
        default: "8"
      trace_over:
        description: Keep the trace when the observed first paint is later than this (ms)
        default: "1500"
      browser:
        description: chrome (new headless) or headless-shell (the old headless build, which PageSpeed uses)
        default: headless-shell
      squeeze:
        description: 0 = whole machine. N = pin everything to one CPU core and run N busy loops on it (a slow, contended lab machine)
        default: "2"

permissions:
  contents: read

jobs:
  lighthouse:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run Lighthouse
        env:
          PAGE_URL: ${{ inputs.url }}
          RUNS: ${{ inputs.runs }}
          TRACE_OVER: ${{ inputs.trace_over }}
          BROWSER: ${{ inputs.browser }}
          SQUEEZE: ${{ inputs.squeeze }}
          LP_CHROME_FLAGS: --headless --no-first-run --no-sandbox
        run: |
          if [ "$BROWSER" = "headless-shell" ]; then
            export LP_CHROME="$(npx -y @puppeteer/browsers install chrome-headless-shell@stable --path "$HOME/browsers" | tail -1 | cut -d' ' -f2-)"
          fi
          echo "browser: ${LP_CHROME:-system chrome} | squeeze: $SQUEEZE | cores: $(nproc)" | tee out-summary.txt
          run="python3 tools/perf/lh_run.py"
          if [ "$SQUEEZE" -gt 0 ] 2>/dev/null; then
            for i in $(seq 1 "$SQUEEZE"); do taskset -c 0 sh -c 'while :; do :; done' & done
            run="taskset -c 0 $run"
          fi
          $run "$PAGE_URL" --runs "$RUNS" --label ci --out out --trace-over "$TRACE_OVER" | tee -a out-summary.txt
          kill $(jobs -p) 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lighthouse-lab
          path: |
            out
            out-summary.txt
          retention-days: 7
